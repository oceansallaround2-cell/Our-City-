<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Our City</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#1a1020;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#fff;touch-action:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.g{background:rgba(20,14,30,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);border-radius:16px}
#sel{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));text-align:center}
#sel h1{margin:0 0 4px;font-size:26px;letter-spacing:.06em}
#sel p{margin:0 0 12px;opacity:.75;font-size:14px}
.row{display:flex;gap:10px;justify-content:center}
.btn{flex:1;max-width:220px;padding:14px 8px;font:inherit;font-size:16px;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:14px;background:linear-gradient(135deg,#b3345a,#6b2a7a);cursor:pointer}
.btn.b{background:linear-gradient(135deg,#2c4a7a,#23233f)}
#hud{display:none}#mm{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));width:120px;height:120px;border-radius:50%;background:rgba(20,14,30,.6);box-shadow:0 4px 18px rgba(0,0,0,.5)}
#name{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 14px;font-size:14px}
#obj{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 14px;font-size:14px;max-width:30vw;font-size:12px;text-align:right}
#coin{position:fixed;left:12px;top:calc(58px + env(safe-area-inset-top,0px));padding:6px 12px;font-size:14px;background:rgba(20,14,30,.55);border:1px solid rgba(255,215,100,.5);border-radius:16px;color:#ffd24a}#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(140px + env(safe-area-inset-top,0px));padding:10px 18px;border-radius:16px;background:rgba(179,52,90,.85);opacity:0;transition:opacity .3s;font-size:16px;white-space:nowrap}.ht{position:fixed;bottom:30%;font-size:26px;pointer-events:none;animation:fl 2s forwards}@keyframes fl{to{transform:translateY(-240px);opacity:0}}#swap{position:fixed;left:12px;top:calc(100px + env(safe-area-inset-top,0px));padding:8px 12px;font:inherit;font-size:13px;color:#fff;cursor:pointer}
#help{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;padding:8px 14px;font-size:12px;opacity:.8;white-space:nowrap}
#joy{position:fixed;left:22px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;display:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
.tb{position:fixed;right:22px;width:62px;height:62px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:13px}
@media(pointer:coarse){#joy{display:block}.tb{display:flex}#help{display:none}}
</style></head><body>
<div id="sel" class="g" style="border-radius:20px 20px 0 0;border-bottom:0"><h1 style="background:linear-gradient(90deg,#ff9ec0,#ffd9a0);-webkit-background-clip:text;background-clip:text;color:transparent">OUR CITY ❤️</h1><p>Sidrah &amp; Priyanshuu · pick who to play, your love walks beside you</p>
<div class="row"><button class="btn" id="bs">Play as Sidrah</button><button class="btn b" id="bp">Play as Priyanshuu</button></div></div>
<div id="hud"><canvas id="mm" width="150" height="150"></canvas><div id="name" class="g"></div><div id="coin">🪙 0</div><div id="toast"></div><div id="obj" class="g"></div><button id="swap" class="g">Swap character (Tab)</button>
<div id="help" class="g">WASD move · Shift run · Space jump/handbrake · F car · drag to look</div>
<div id="joy" class="g"><div id="knob"></div></div>
<div id="bj" class="tb g" style="bottom:calc(40px + env(safe-area-inset-bottom,0px))">Jump</div>
<div id="br" class="tb g" style="bottom:calc(116px + env(safe-area-inset-bottom,0px))">Run</div><div id="bf" class="tb g" style="bottom:calc(192px + env(safe-area-inset-bottom,0px))">Car</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
// sunset sky
(function(){const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);
g.addColorStop(0,'#3b2a6b');g.addColorStop(.5,'#d9708a');g.addColorStop(.8,'#ffb27a');g.addColorStop(1,'#ffd9a0');x.fillStyle=g;x.fillRect(0,0,2,256);scene.background=new THREE.CanvasTexture(c)})();
scene.fog=new THREE.Fog(0xf0a98a,60,380);
const cam=new THREE.PerspectiveCamera(60,1,.1,900);
scene.add(new THREE.HemisphereLight(0xffc9a8,0x3a3050,.85));
const sun=new THREE.DirectionalLight(0xffb27a,1.3);sun.position.set(80,60,-40);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:220});scene.add(sun,sun.target);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75},o));
function mesh(g,m,x=0,y=0,z=0,s){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;if(s)o.scale.set(s[0],s[1],s[2]);return o}
const sph=(r)=>new THREE.SphereGeometry(r,16,12),cyl=(a,b,h)=>new THREE.CylinderGeometry(a,b,h,12);

/* ---------- characters ---------- */
function makeChar(c){
 const R=new THREE.Group(),skin=M(c.skin,{roughness:.5}),top=M(c.top,{roughness:.9}),bot=M(c.bot),shoe=M(c.shoe,{roughness:.4}),hair=M(c.hair,{roughness:.35});
 const legs=[-1,1].map(s=>{const t=new THREE.Group();t.position.set(s*.11,.95,0);t.add(mesh(cyl(.09,.07,.48),bot,0,-.24,0));
  const k=new THREE.Group();k.position.y=-.48;k.add(mesh(cyl(.07,.055,.46),bot,0,-.23,0),mesh(new THREE.BoxGeometry(.11,.07,.27),shoe,0,-.5,.05));t.add(k);R.add(t);return t});
 const B=new THREE.Group();R.add(B);
 B.add(mesh(cyl(c.f?.17:.21,c.f?.14:.17,.56),top,0,1.2,0));
 if(c.f){B.add(mesh(cyl(.15,.27,.8),top,0,.95,0))} // long kurta
 // gold embroidery on kurta / chain on jacket
 if(c.f){const gm=M(0xe8c98a,{metalness:.6,roughness:.3});B.add(mesh(new THREE.BoxGeometry(.07,.5,.01),gm,0,1.05,.2));B.add(mesh(new THREE.BoxGeometry(.3,.03,.01),gm,0,1.4,.17))}
 else{const ch=mesh(new THREE.TorusGeometry(.07,.008,6,18),M(0xcfd6e0,{metalness:.9,roughness:.2}),0,1.38,.19);ch.scale.set(1,1.5,1);B.add(ch);B.add(mesh(new THREE.BoxGeometry(.03,.05,.008),M(0xcfd6e0,{metalness:.9}),0,1.28,.2));
  B.add(mesh(new THREE.BoxGeometry(.2,.4,.01),M(0x15151a),0,1.2,.215))}
 const arms=[-1,1].map(s=>{const a=new THREE.Group();a.position.set(s*(c.f?.23:.27),1.43,0);a.add(mesh(cyl(.065,.055,.3),top,0,-.15,0));
  const f=new THREE.Group();f.position.y=-.3;f.add(mesh(cyl(.055,.045,.27),top,0,-.135,0),mesh(sph(.05),skin,0,-.3,0));
  if(!c.f&&s>0)f.add(mesh(cyl(.052,.052,.04),M(0xb8bcc6,{metalness:.9,roughness:.2}),0,-.24,0));
  a.add(f);B.add(a);return a});
 const H=new THREE.Group();H.position.y=1.62;B.add(H);
 H.add(mesh(cyl(.05,.06,.1),skin,0,.04,0),mesh(sph(.15),skin,0,.2,0,[.95,1.1,.95]));
 for(const s of[-1,1]){H.add(mesh(sph(.026),M(0xffffff,{roughness:.3}),s*.055,.22,.125,[1,.85,.6]),mesh(sph(.015),M(0x1b100a,{roughness:.2}),s*.055,.22,.142),
  mesh(new THREE.BoxGeometry(.075,c.f?.014:.02,.012),hair,s*.058,.262,.135),mesh(sph(.03),skin,s*.15,.19,0,[.5,1,.7]));
  if(c.f)H.add(mesh(sph(.028),M(0xff9aa5,{transparent:true,opacity:.35}),s*.085,.15,.12,[1,.7,.3]))}
 H.add(mesh(sph(.022),skin,0,.18,.15,[1,1.2,1]),mesh(new THREE.BoxGeometry(.05,.012,.01),M(c.f?0xd9707a:0x9a5a55),0,.115,.145));
 if(c.f){ // long wavy hair, side strands, bow, jhumkas
  H.add(mesh(sph(.165),hair,0,.26,-.015,[1.02,.95,1.02]),mesh(sph(.17),hair,0,.02,-.075,[1.1,2.5,.7]));
  for(const s of[-1,1]){H.add(mesh(cyl(.035,.02,.5),hair,s*.15,-.03,.01));
   H.add(mesh(sph(.02),M(0xe8c98a,{metalness:.7,roughness:.3}),s*.16,.13,.01),mesh(new THREE.ConeGeometry(.025,.05,8),M(0xe8c98a,{metalness:.7,roughness:.3}),s*.16,.09,.01,[1,-1,1]),mesh(sph(.012),M(0xfff4e6),s*.16,.055,.01))}
  const bm=M(0x7a0f1e,{roughness:.4});H.add(mesh(sph(.05),bm,-.14,.33,-.01,[1.2,1.4,.5]),mesh(sph(.05),bm,-.19,.3,-.01,[1.2,1.4,.5]))
 }else{ // short wavy dark hair + trimmed beard
  H.add(mesh(sph(.16),hair,0,.27,-.01,[1.02,.8,1.05]));
  [[.0,.4,.06],[.08,.38,.03],[-.08,.38,.03],[.05,.36,.1],[-.05,.37,.09],[.12,.33,-.02]].forEach(p=>H.add(mesh(sph(.06),hair,p[0],p[1]-.03,p[2],[1,.8,1])));
  H.add(mesh(sph(.125),hair,0,.1,.03,[1.12,.8,.95]),mesh(new THREE.BoxGeometry(.07,.014,.012),hair,0,.135,.152))}
 /* styling pass */
 const gold=M(0xe8c98a,{metalness:.7,roughness:.25}),lash=M(0x0a0605);
 for(const s of[-1,1]){H.add(mesh(sph(.019),M(c.f?0x6a3c1c:0x4a3a28),s*.055,.22,.14,[1,1,.5]),mesh(sph(.0095),M(0xffffff,{emissive:0xffffff}),s*.05,.227,.152),mesh(new THREE.BoxGeometry(.064,.009,.01),lash,s*.056,.238,.14))}
 if(c.f){const dm=M(0xf1d6c2,{roughness:.8});
  const dp=mesh(new THREE.BoxGeometry(.13,.82,.02),dm,-.05,1.08,.215);dp.rotation.z=.38;B.add(dp);
  const dg=mesh(new THREE.BoxGeometry(.012,.82,.022),gold,-.075,1.08,.215);dg.rotation.z=.38;B.add(dg);
  const nk=mesh(new THREE.TorusGeometry(.085,.01,6,18),gold,0,1.43,.1);nk.rotation.x=1.2;B.add(nk);
  for(const a of arms){const t2=mesh(new THREE.TorusGeometry(.052,.009,6,14),gold,0,-.27,0);t2.rotation.x=Math.PI/2;a.children[1].add(t2)}
  H.add(mesh(sph(.011),M(0xc0102a),0,.285,.146),mesh(sph(.024),M(0xe0707c),0,.113,.143,[1.5,.55,.5]));
  for(const s of[-1,1])for(let k=0;k<4;k++)H.add(mesh(sph(.055),hair,s*(.155+(k%2)*.025),-.08-k*.1,.02,[1,1.3,1]));
 }else{
  for(const s of[-1,1]){const cl=mesh(new THREE.BoxGeometry(.11,.07,.03),top,s*.075,1.46,.17);cl.rotation.z=-s*.5;B.add(cl);
   B.add(mesh(new THREE.BoxGeometry(.09,.08,.02),top,s*.1,1.2,.222));
   const f=arms[s<0?0:1].children[1];f.children[0].material=skin;const tr=mesh(new THREE.TorusGeometry(.06,.014,6,14),top,0,-.01,0);tr.rotation.x=Math.PI/2;f.add(tr);
   legs[s<0?0:1].children[1].add(mesh(new THREE.BoxGeometry(.125,.035,.29),M(0xf2f2f2),0,-.535,.05))}
  H.add(mesh(sph(.07),hair,0,.42,.05,[1.3,.9,1.3]),mesh(sph(.05),hair,.06,.41,.1))}
 R.traverse(o=>{if(o.isMesh)o.castShadow=true});
 return{root:R,legs,arms,head:H,body:B,ph:0,vy:0,spd:0};
}
const SID=makeChar({f:1,skin:0xe8b595,hair:0x2a1810,top:0x8b1e2c,bot:0x7a1a28,shoe:0xc9a15a});
const PRI=makeChar({skin:0xd7a384,hair:0x14100f,top:0x1c1b1f,bot:0x18181d,shoe:0x0e0e10});
scene.add(SID.root,PRI.root);
function animChar(ch,dt,spd,run,t){
 ch.spd=spd;ch.ph+=dt*spd*1.7;const a=Math.min(spd/3,1)*(run?.95:.6);
 ch.legs[0].rotation.x=Math.sin(ch.ph)*a;ch.legs[1].rotation.x=-Math.sin(ch.ph)*a;
 ch.arms[0].rotation.x=-Math.sin(ch.ph)*a*.8;ch.arms[1].rotation.x=Math.sin(ch.ph)*a*.8;
 ch.body.position.y=Math.abs(Math.sin(ch.ph))*.04*a+Math.sin(t*2)*.004;ch.head.rotation.y=spd<.1?Math.sin(t*.7)*.15:0;
 if(ch.root.position.y>.05){ch.legs[0].rotation.x=-.6;ch.legs[1].rotation.x=.3;ch.arms[0].rotation.x=ch.arms[1].rotation.x=-1.2}
}

/* ---------- city ---------- */
const S=64,boxes=[];
const ground=mesh(new THREE.PlaneGeometry(700,700),M(0x4b6b45),0,0,0);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.castShadow=false;scene.add(ground);
const roadM=M(0x2a2a30,{roughness:.9}),lineM=new THREE.MeshBasicMaterial({color:0xf2e6b8});
for(let i=-5;i<=4;i++){for(const h of[0,1]){const r=new THREE.Mesh(new THREE.PlaneGeometry(h?640:14,h?14:640),roadM);r.rotation.x=-Math.PI/2;r.position.set(h?0:i*S,.02,h?i*S:0);r.receiveShadow=true;scene.add(r);
 const l=new THREE.Mesh(new THREE.PlaneGeometry(h?640:.3,h?.3:640),lineM);l.rotation.x=-Math.PI/2;l.position.set(h?0:i*S,.04,h?i*S:0);scene.add(l)}}
const wc=document.createElement('canvas');wc.width=64;wc.height=128;{const x=wc.getContext('2d');x.fillStyle='#2b3345';x.fillRect(0,0,64,128);for(let i=0;i<8;i++)for(let j=0;j<16;j++){x.fillStyle=Math.random()<.45?'#ffd98a':'#46506a';x.fillRect(i*8+2,j*8+2,4,5)}}
const baseTex=new THREE.CanvasTexture(wc);baseTex.wrapS=baseTex.wrapT=THREE.RepeatWrapping;
function building(x,z,w,d,h){const t=baseTex.clone();t.needsUpdate=true;t.repeat.set(w/8,h/12);
 const m=new THREE.MeshStandardMaterial({map:t,emissive:0xffffff,emissiveMap:t,emissiveIntensity:.3,roughness:.6});
 const b=mesh(new THREE.BoxGeometry(w,h,d),m,x,h/2,z);b.receiveShadow=true;scene.add(b);boxes.push([x-w/2,x+w/2,z-d/2,z+d/2])}
function palm(x,z){const g=new THREE.Group(),h=5+Math.random()*2;g.add(mesh(cyl(.18,.28,h),M(0x7a5a3a),0,h/2,0));
 for(let i=0;i<7;i++){const l=mesh(new THREE.ConeGeometry(.4,3.2,4),M(0x2f7a3a),0,h,0);l.rotation.z=1.3;l.rotation.y=i*.9;l.position.set(Math.cos(i*.9)*1.4,h,Math.sin(-i*.9)*1.4);g.add(l)}
 g.position.set(x,0,z);scene.add(g)}
function tree(x,z){const g=new THREE.Group();g.add(mesh(cyl(.2,.3,2),M(0x5a3d28),0,1,0),mesh(sph(1.6),M(0x2f6a3a),0,3.2,0));g.position.set(x,0,z);scene.add(g)}
function lamp(x,z){const g=new THREE.Group();g.add(mesh(cyl(.07,.09,5),M(0x333340),0,2.5,0),mesh(sph(.25),new THREE.MeshBasicMaterial({color:0xffe2a0}),0,5.1,0));g.position.set(x,0,z);scene.add(g)}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=-5;i<=2;i++)for(let j=-5;j<=4;j++){const cx=i*S+S/2,cz=j*S+S/2;
 if(i===0&&j===0){ // plaza / park
  const p=mesh(cyl(9,9,.3),M(0xb9b2a5),cx,.15,cz);p.receiveShadow=true;scene.add(p);
  for(let k=0;k<10;k++){const a=k/10*6.28;tree(cx+Math.cos(a)*20,cz+Math.sin(a)*20)}
  const f=mesh(cyl(1.4,1.8,1),M(0xcfc8b8),cx,.8,cz+12);scene.add(f);continue}
 const n=1+Math.floor(rnd()*3);
 if(n===1)building(cx,cz,26+rnd()*10,26+rnd()*10,20+rnd()*(Math.abs(i)+Math.abs(j)<3?90:40));
 else for(let k=0;k<2;k++)building(cx+(k?1:-1)*12,cz+(rnd()-.5)*8,16+rnd()*4,20+rnd()*10,12+rnd()*55);
 lamp(cx-S/2+9,cz-S/2+9)}
// beach & ocean
const sand=mesh(new THREE.PlaneGeometry(150,700),M(0xe6cf9c),265,0,0);sand.rotation.x=-Math.PI/2;sand.position.y=.03;sand.receiveShadow=true;scene.add(sand);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(600,700),new THREE.MeshStandardMaterial({color:0x2a7a9a,roughness:.15,metalness:.4}));sea.rotation.x=-Math.PI/2;sea.position.set(640,.06,0);scene.add(sea);
for(let k=0;k<26;k++)palm(215+rnd()*70,-300+rnd()*600);
for(let k=0;k<6;k++){const m=mesh(new THREE.ConeGeometry(70+rnd()*40,110+rnd()*60,6),M(0x55506a),-300+k*110,50,-400);scene.add(m)}
// goal beacon at the beach
const goal=new THREE.Vector3(250,0,32),bea=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,60,16,1,true),new THREE.MeshBasicMaterial({color:0xff6fa5,transparent:true,opacity:.35,side:THREE.DoubleSide}));
bea.position.set(goal.x,30,goal.z);scene.add(bea);

/* ---------- state & input ---------- */
let mode='select',me=SID,pal=PRI,yaw=0,pit=.25,t=0;const keys={},joy={x:0,y:0};let runBtn=false,jumpBtn=false;
const P0=new THREE.Vector3(S/2,0,S/2);
SID.root.position.set(P0.x-1.2,0,P0.z);PRI.root.position.set(P0.x+1.2,0,P0.z);
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Tab'){e.preventDefault();if(mode==='play')swap()}if(e.code==='Space')e.preventDefault();if(e.code==='KeyF'&&mode==='play')toggleCar()});
addEventListener('keyup',e=>keys[e.code]=0);
let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId};renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;yaw-=(e.clientX-drag.x)*.006;pit=Math.max(-.1,Math.min(1.1,pit+(e.clientY-drag.y)*.005));drag.x=e.clientX;drag.y=e.clientY});
renderer.domElement.addEventListener('pointerup',()=>drag=null);
const joyEl=$('joy'),knob=$('knob');let jid=null;
function jm(e){const r=joyEl.getBoundingClientRect();let dx=(e.clientX-r.left-60)/50,dy=(e.clientY-r.top-60)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=-dy;knob.style.left=40+dx*40+'px';knob.style.top=40+dy*40+'px'}
joyEl.addEventListener('pointerdown',e=>{jid=e.pointerId;joyEl.setPointerCapture(jid);jm(e)});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const jend=()=>{jid=null;joy.x=joy.y=0;knob.style.left=knob.style.top='40px'};joyEl.addEventListener('pointerup',jend);joyEl.addEventListener('pointercancel',jend);
$('bj').addEventListener('pointerdown',()=>jumpBtn=true);$('bj').addEventListener('pointerup',()=>jumpBtn=false);
$('br').addEventListener('pointerdown',()=>{runBtn=!runBtn;$('br').style.background=runBtn?'rgba(179,52,90,.7)':''});
function setHud(){$('name').textContent=(me===SID?'Sidrah':'Priyanshuu')+' ❤️';}
function start(who){me=who;pal=who===SID?PRI:SID;mode='play';$('sel').style.display='none';$('hud').style.display='block';setHud();ding('Welcome, Sidrah & Priyanshuu ❤️');hearts();yaw=0}
function swap(){const a=me;me=pal;pal=a;setHud()}
$('bs').onclick=()=>start(SID);$('bp').onclick=()=>start(PRI);$('swap').onclick=swap;
function collide(p,r0=.4){for(const b of boxes){const r=r0;if(p.x>b[0]-r&&p.x<b[1]+r&&p.z>b[2]-r&&p.z<b[3]+r){const dl=p.x-(b[0]-r),dr=b[1]+r-p.x,df=p.z-(b[2]-r),db=b[3]+r-p.z,m=Math.min(dl,dr,df,db);
 if(m===dl)p.x=b[0]-r;else if(m===dr)p.x=b[1]+r;else if(m===df)p.z=b[2]-r;else p.z=b[3]+r}}
 p.x=Math.max(-300,Math.min(325,p.x));p.z=Math.max(-300,Math.min(300,p.z))}
const turn=(ch,a,dt)=>{let d=a-ch.root.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));ch.root.rotation.y+=d*Math.min(1,dt*10)};
function step(ch,dt,dx,dz,spd,jump){const p=ch.root.position;

{const c=document.createElement('canvas');c.width=768;c.height=160;const x=c.getContext('2d');x.font='bold 56px Georgia';x.textAlign='center';x.fillStyle='#ff9ec0';x.shadowColor='#ff4f93';x.shadowBlur=18;x.fillText('Sidrah ❤ Priyanshuu',384,100);

 mx.fillStyle='#ff4f93';mx.beginPath();mx.arc(h+sx,h+sy,5,0,6.283);mx.fill();mx.strokeStyle='#fff';mx.lineWidth=1.5;mx.stroke();
 mx.fillStyle='#fff';mx.beginPath();mx.moveTo(h,h-8);mx.lineTo(h+6,h+7);mx.lineTo(h,h+3);mx.lineTo(h-6,h+7);mx.closePath();mx.fill();

 mx.fillStyle='#fff';mx.font='bold 12px sans-serif';mx.textAlign='center';mx.fillText('N',h+Math.sin(yaw)*(h-12),h-Math.cos(yaw)*(h-12)+4)}

 else{

  drv.h-=ix*Math.min(Math.abs(drv.v)/7,1)*Math.sign(drv.v)*1.6*dt;const g=drv.g,b0=g.position.x+g.position.z;g.position.x+=Math.sin(drv.h)*drv.v*dt;g.position.z+=Math.cos(drv.h)*drv.v*dt;
